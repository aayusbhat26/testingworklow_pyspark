name: PySpark Data Processing Workflow

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  fetch-process-upload:
    # Standard GitHub runners provide 2 vCPUs and 7GB RAM.
    # If you have access to GitHub Larger Runners (e.g. 16GB RAM), you would change this to the larger runner label.
    runs-on: ubuntu-latest 
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run PySpark Transformation Script
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      run: |
        python src/process_pyspark.py
